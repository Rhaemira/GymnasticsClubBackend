name: Backend CI
on:
  push:
    branches: [main, "engineering/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gymnastics_test
          POSTGRES_USER: gymnastics_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymnastics_test -d gymnastics_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: gymnastics_test
      DATABASE_USERNAME: gymnastics_test
      DATABASE_PASSWORD: test-only-password
      DATABASE_TLS: disable
      AUTH_TOKEN_TTL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build
      - name: Run PostgreSQL integration tests
        run: swift test

  docker-smoke:
    runs-on: ubuntu-24.04
    env:
      DATABASE_PASSWORD: ci-only-password
      DATABASE_NAME: gymnastics_club
      DATABASE_USERNAME: gymnastics_dev
      APP_BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Build and start PostgreSQL, migrations and Vapor
        run: docker compose up --build -d
      - name: Verify health and authenticated API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            if [[ "$attempt" == 60 ]]; then docker compose logs; exit 1; fi
            sleep 2
          done
          docker compose run --rm -e ADMIN_EMAIL=ci-admin@example.test -e ADMIN_INITIAL_PASSWORD=ci-only-password-123 app create-admin
          TOKEN="$(curl --fail --silent -X POST http://127.0.0.1:8080/auth/login -H 'Content-Type: application/json' -d '{"email":"ci-admin@example.test","password":"ci-only-password-123"}' | jq -r .token)"
          test -n "$TOKEN"
          echo "CI_BEARER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl --fail --silent -X POST http://127.0.0.1:8080/athletes -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"fullName":"CI Athlete","age":12,"level":"Beginner"}' >/dev/null
          curl --fail --silent http://127.0.0.1:8080/athletes -H "Authorization: Bearer $TOKEN" | jq -e 'length == 1'
      - name: Verify database volume survives service restarts
        shell: bash
        run: |
          set -euo pipefail
          docker compose restart db
          for attempt in {1..60}; do
            if docker compose exec -T db pg_isready -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" >/dev/null; then break; fi
            if [[ "$attempt" == 60 ]]; then docker compose logs db; exit 1; fi
            sleep 2
          done
          docker compose restart app
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            if [[ "$attempt" == 60 ]]; then docker compose logs app; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/athletes -H "Authorization: Bearer $CI_BEARER_TOKEN" | jq -e 'length == 1'
      - name: Preserve cleanup
        if: always()
        run: docker compose down
